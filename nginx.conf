# Self-hosting: nginx serving the static portfolio (used by the Dockerfile)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

  # Security headers (repeated per location because nginx does not inherit add_header into a location that sets its own)
  include /etc/nginx/snippets/security-headers.conf;

  location = /404.html { internal; include /etc/nginx/snippets/security-headers.conf; }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location /assets/fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location /assets/video/ {            # mp4 range requests (seeking) work out of the box
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
