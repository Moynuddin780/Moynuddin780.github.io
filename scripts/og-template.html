<!doctype html>
<!-- Source of assets/img/og-image.png (the card shown when the link is shared).
     Regenerate:  google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1200,630 \
                  --screenshot=assets/img/og-image.png file://$PWD/scripts/og-template.html -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#f6f5f1;overflow:hidden}
  body{position:relative;font-family:"Inter",system-ui,sans-serif;color:#3b4048}
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(18,20,23,.085) 1px,transparent 1px);background-size:22px 22px;
    -webkit-mask-image:radial-gradient(ellipse 65% 80% at 80% 40%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 65% 80% at 80% 40%,#000 10%,transparent 75%)}
  .text{position:absolute;left:80px;top:112px;width:660px}

  .eyebrow b{color:#0f6b54;font-weight:500}.eyebrow i{width:54px;height:1px;background:#c9c5bb}
  h1{margin:24px 0 0;font:700 74px/1.04 "Inter",sans-serif;letter-spacing:-.035em;color:#121417}
  .role{margin-top:18px;font:600 32px/1.15 "Inter",sans-serif;color:#0f6b54;letter-spacing:-.02em}
  p{margin:26px 0 0;font-size:22px;line-height:1.5;color:#3b4048;max-width:620px}
  .photo{position:absolute;left:790px;top:108px;width:330px;height:412px;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px -28px rgba(18,20,23,.4)}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 32%}
  .c{position:absolute;width:26px;height:26px;border:0 solid #0f6b54}
  .c.tl{left:776px;top:94px;border-top-width:2px;border-left-width:2px}.c.tr{left:1108px;top:94px;border-top-width:2px;border-right-width:2px}
  .c.bl{left:776px;top:508px;border-bottom-width:2px;border-left-width:2px}.c.br{left:1108px;top:508px;border-bottom-width:2px;border-right-width:2px}
</style></head><body>
<div class="dots"></div>
<div class="text">
  <div class="eyebrow"><b>Portfolio</b><i></i><span>Computer Vision · Edge AI</span></div>
  <h1>Moynuddin<br>Al Masum</h1>
  <div class="role">AI Engineer (Computer Vision)</div>
  <p>Real-time vision systems on live camera streams and edge NPUs: face recognition, counting and tracking.</p>
</div>
<div class="photo"><img src="../assets/img/profile.jpg" alt=""></div>
<span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
